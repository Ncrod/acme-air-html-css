<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/recuperar-contrasena.css">
    <title>Recuperar contraseña - ACME AIR</title>
</head>
<body>
    <div class="recuperar-contrasena-page">
        <div class="image-side">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR">
        </div>
        <div class="form-side">
            <div class="form-box">
                <h1>Recuperar contraseña</h1>
                <p class="info-text">Ingresa tu correo y te enviaremos los pasos para crear una nueva contraseña.</p>

                <form>
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

                    <a href="crear-contrasena.html" class="btn-primary">Enviar</a>
                </form>

                <div class="links-row">
                    <a href="index.html">Volver a iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
