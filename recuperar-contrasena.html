<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ACME AIR: recupera el acceso a tu cuenta.">
    <title>Recuperar contraseña - ACME AIR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth">
        <div class="auth__brand">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR" class="auth__logo">
        </div>

        <div class="auth__form">
            <div class="form-box">
                <h1 class="titulo">Recuperar contraseña</h1>
                <p class="info-text">Ingresa tu correo y te enviaremos los pasos para crear una nueva contraseña.</p>

                <form class="formulario">
                    <div class="campo">
                        <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
                        <label for="email">Correo</label>
                    </div>

                    <a href="crear-contrasena.html" class="btn-primario">Enviar</a>
                </form>

                <div class="links-row">
                    <a href="index.html">Volver a iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
