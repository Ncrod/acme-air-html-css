<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ACME AIR: crea tu cuenta con tus datos personales.">
    <title>Crear cuenta - ACME AIR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth">
        <div class="auth__brand">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR" class="auth__logo">
        </div>

        <div class="auth__form">
            <div class="form-box">
                <h1 class="titulo">Crear cuenta</h1>

                <form class="formulario">
                    <div class="campo">
                        <input type="text" id="nombre" name="nombre" placeholder=" " autocomplete="name" required>
                        <label for="nombre">Nombre completo</label>
                    </div>

                    <div class="campo">
                        <input type="text" id="identificacion" name="identificacion" placeholder=" " required>
                        <label for="identificacion">Identificación</label>
                    </div>

                    <div class="campo">
                        <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
                        <label for="email">E-mail</label>
                    </div>

                    <div class="campo">
                        <input type="tel" id="telefono" name="telefono" placeholder=" " autocomplete="tel" inputmode="tel" required>
                        <label for="telefono">Teléfono</label>
                    </div>

                    <div class="campo">
                        <input type="text" id="ciudad" name="ciudad" placeholder=" " autocomplete="address-level2" required>
                        <label for="ciudad">Ciudad</label>
                    </div>

                    <a href="crear-contrasena.html" class="btn-primario">Guardar</a>
                </form>

                <div class="links-row">
                    <a href="index.html">Ya tengo cuenta, iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
