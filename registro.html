<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/registro.css">
    <title>Crear cuenta - ACME AIR</title>
</head>
<body>
    <div class="registro-page">
        <div class="image-side">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR">
        </div>
        <div class="form-side">
            <div class="form-box">
                <h1>Crear cuenta</h1>

                <form>
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>

                    <label for="identificacion">Identificación</label>
                    <input type="text" id="identificacion" name="identificacion" placeholder="Número de identificación" required>

                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required>

                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad" placeholder="Ciudad" required>

                    <a href="crear-contrasena.html" class="btn-primary">Guardar</a>
                </form>

                <div class="links-row">
                    <a href="index.html">Ya tengo cuenta, iniciar sesión</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
