<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/crear-contrasena.css">
    <title>Crear contraseña - ACME AIR</title>
</head>
<body>
    <div class="crear-contrasena-page">
        <div class="image-side">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR">
        </div>
        <div class="form-side">
            <div class="form-box">
                <h1>Crear contraseña</h1>

                <form>
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>

                    <label for="repeat-password">Repetir contraseña</label>
                    <input type="password" id="repeat-password" name="repeat-password" placeholder="Repetir contraseña" required>

                    <a href="menu.html" class="btn-primary">Guardar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
