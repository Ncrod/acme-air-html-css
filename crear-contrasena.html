<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ACME AIR: define la contraseña de tu cuenta.">
    <title>Crear contraseña - ACME AIR</title>
    <!-- Tipografía Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth">
        <div class="auth__brand">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR" class="auth__logo">
        </div>

        <div class="auth__form">
            <div class="form-box">
                <h1 class="titulo">Crear contraseña</h1>

                <form class="formulario">
                    <div class="campo">
                        <input type="password" id="password" name="password" placeholder=" " autocomplete="new-password" required>
                        <label for="password">Contraseña</label>
                    </div>

                    <div class="campo">
                        <input type="password" id="repeat-password" name="repeat-password" placeholder=" " autocomplete="new-password" required>
                        <label for="repeat-password">Repetir contraseña</label>
                    </div>

                    <a href="menu.html" class="btn-primario">Guardar</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
