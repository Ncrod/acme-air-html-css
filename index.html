<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/index.css">
    <title>Login - ACME AIR</title>
</head>
<body>
    <div class="login-page">
        <div class="image-side">
            <img src="img/icons/LogoBlanco.svg" alt="ACME AIR">
        </div>
        <div class="form-side">
            <div class="form-box">
                <h1>Iniciar sesión</h1>

                <form>
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>

                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>

                    <div class="checkbox-row">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Recordar mis datos</label>
                    </div>

                    <a href="menu.html" class="btn-primary">Ingresar</a>
                </form>

                <div class="links-row">
                    <a href="registro.html">Crear cuenta</a>
                    <a href="recuperar-contrasena.html">¿Has olvidado tu contraseña?</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
